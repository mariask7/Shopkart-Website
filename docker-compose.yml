services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shopkart
      MYSQL_USER: ${DB_USERNAME:-shopkart}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - shopkart_mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/001-shopkart.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./shopkart/backend
      dockerfile: Dockerfile
    environment:
      DB_URL: "${DB_URL:-jdbc:mysql://mysql:3306/shopkart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
      DB_USERNAME: ${DB_USERNAME:-shopkart}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      SHOPKART_CATALOG_IMPORT_ON_START: ${SHOPKART_CATALOG_IMPORT_ON_START:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./shopkart
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  shopkart_mysql_data:
