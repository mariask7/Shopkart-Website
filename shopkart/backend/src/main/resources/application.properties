spring.application.name=shopkart-backend
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopkart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
shopkart.catalog.import-on-start=true
shopkart.jwt.secret=${JWT_SECRET}
shopkart.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
shopkart.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
